[project]
name = "proofquest"
version = "0.7.0"
description = "Deterministic generator of Lean 4 games (GameSkeleton) from leanblueprint projects"
readme = "README.md"
authors = [{ name = "M3zzinho", email = "gustavo.mezzovilla@gmail.com" }]
requires-python = ">=3.12"
dependencies = []
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
Repository = "https://github.com/Mezzovilla/proofquest"
Issues = "https://github.com/Mezzovilla/proofquest/issues"

[project.scripts]
proofquest = "proofquest.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=7.1.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
markers = [
  "integration: real repository workflows requiring --run-integration, network, git and Lean",
]
